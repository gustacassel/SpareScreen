name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Command line works
        run: python -m sparescreen --help

  web:
    name: Page syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app.js syntax
        run: |
          python -c "from sparescreen.server import app_js; open('app-bundle.js', 'w', encoding='utf-8').write(app_js())"
          node --check app-bundle.js
          node --check sparescreen/web/panel.js
