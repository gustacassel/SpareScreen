name: Build executables

# Builds a single-file executable per OS with PyInstaller and attaches it to the release,
# so people can download and run SpareScreen without installing Python.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the executables to (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: sparescreen-windows-x64.exe
            built: dist/sparescreen.exe
          - os: ubuntu-latest
            asset: sparescreen-linux-x64
            built: dist/sparescreen
          - os: macos-latest
            asset: sparescreen-macos-arm64
            built: dist/sparescreen
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Install
        if: runner.os != 'Linux'
        run: python -m pip install . pyinstaller pillow
      - name: Build
        if: runner.os != 'Linux'
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          # pystray picks its backend at runtime, so name the Windows one (ignored elsewhere).
          pyinstaller --noconfirm --onefile --name sparescreen --paths . --hidden-import pystray._win32 \
            --add-data "sparescreen/web${SEP}sparescreen/web" \
            --icon assets/icon.ico packaging/entry.py
      - name: Build (Linux, on an older Debian)
        if: runner.os == 'Linux'
        # A Linux executable only runs on systems at least as new as the one that built it
        # (glibc). Built on Debian 11 it runs on Ubuntu 20.04, Debian 11, Mint 20 and newer;
        # built on the runner's own Ubuntu it needed 24.04.
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12-bullseye bash -c \
            "pip install -q . pyinstaller pillow && pyinstaller --noconfirm --onefile --name sparescreen \
             --paths . --add-data sparescreen/web:sparescreen/web packaging/entry.py"
      - name: Smoke test
        run: |
          ./${{ matrix.built }} --version
          echo '{"model":{"display_name":"Test"}}' | ./${{ matrix.built }} statusline
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ matrix.built }}" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  checksums:
    # One SHA256SUMS file for every executable of the release: the in-app update refuses a
    # download that doesn't match it (sparescreen/update.py).
    name: SHA256SUMS
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Hash the attached executables
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'sparescreen-*' --dir dist
          cd dist
          sha256sum sparescreen-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "${{ github.repository }}" --clobber
