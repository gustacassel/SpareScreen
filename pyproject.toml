[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparescreen"
dynamic = ["version"]  # from sparescreen/__init__.py (packaging/bump.py changes it)
description = "Turn an old phone (or any device with a browser) into a live dashboard for your PC."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    # "Now playing" on Windows (System Media Transport Controls); other OSes use their own tools.
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",  # reads the album cover
    # Tray icon in background mode; optional elsewhere (see sparescreen/tray.py).
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=9; sys_platform == 'win32'",
]

[project.scripts]
sparescreen = "sparescreen.cli:main"
sparescreen-statusline = "sparescreen.statusline:main"

[tool.setuptools]
packages = ["sparescreen"]

[tool.setuptools.dynamic]
version = { attr = "sparescreen.__version__" }

[tool.setuptools.package-data]
sparescreen = ["web/*", "web/app/*"]

[tool.mypy]
# Every function is typed (parameters and return); `mypy` runs in CI. mypy checks with
# 3.10 rules (its oldest); the code still runs on 3.9, which CI tests, because every module
# starts with `from __future__ import annotations` (annotations aren't evaluated).
python_version = "3.10"
files = ["sparescreen", "packaging"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
# Optional, platform-specific packages without type information.
module = ["pystray", "pystray.*", "winrt", "winrt.*"]
ignore_missing_imports = true
