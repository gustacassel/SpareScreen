[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparescreen"
version = "0.6.0"
description = "Turn an old phone (or any device with a browser) into a live dashboard for your PC."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    # "Now playing" on Windows (System Media Transport Controls); other OSes use their own tools.
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",  # reads the album cover
    # Tray icon in background mode; optional elsewhere (see sparescreen/tray.py).
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=9; sys_platform == 'win32'",
]

[project.scripts]
sparescreen = "sparescreen.cli:main"
sparescreen-statusline = "sparescreen.statusline:main"

[tool.setuptools]
packages = ["sparescreen"]

[tool.setuptools.package-data]
sparescreen = ["web/*"]
