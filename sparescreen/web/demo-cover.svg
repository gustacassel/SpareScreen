<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Album cover for the demo mode track "Midnight Drive" by Neon Arcade (original art, MIT like the rest) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a2e"/>
      <stop offset=".55" stop-color="#4b1d6b"/>
      <stop offset="1" stop-color="#d9467a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".5" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b33"/>
      <stop offset="1" stop-color="#05020d"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="300" cy="290" r="140"/></clipPath>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="70" cy="60" r="1.6"/><circle cx="150" cy="120" r="1.2"/><circle cx="240" cy="40" r="1.4"/>
    <circle cx="380" cy="80" r="1.2"/><circle cx="470" cy="45" r="1.8"/><circle cx="540" cy="130" r="1.2"/>
    <circle cx="510" cy="200" r="1"/><circle cx="90" cy="190" r="1"/><circle cx="330" cy="150" r="1"/>
  </g>
  <!-- Sun with the classic stripes cut out of its lower half -->
  <g clip-path="url(#sunclip)">
    <rect x="150" y="150" width="300" height="290" fill="url(#sun)"/>
    <g fill="#4b1d6b">
      <rect x="150" y="268" width="300" height="5"/><rect x="150" y="286" width="300" height="8"/>
      <rect x="150" y="306" width="300" height="11"/><rect x="150" y="330" width="300" height="14"/>
      <rect x="150" y="357" width="300" height="17"/>
    </g>
  </g>
  <!-- Mountains -->
  <path d="M0 420 L90 340 L150 380 L230 300 L300 370 L370 310 L450 380 L520 330 L600 400 L600 430 L0 430 Z" fill="#2a0f4a"/>
  <path d="M0 430 L70 395 L140 420 L210 385 L300 425 L390 390 L470 420 L540 395 L600 425 L600 440 L0 440 Z" fill="#1f0a38"/>
  <!-- Grid road to the horizon -->
  <rect y="430" width="600" height="170" fill="url(#ground)"/>
  <g stroke="#ff3d9a" stroke-width="2" opacity=".85">
    <line x1="0" y1="430" x2="600" y2="430"/>
    <line x1="0" y1="442" x2="600" y2="442"/><line x1="0" y1="458" x2="600" y2="458"/>
    <line x1="0" y1="480" x2="600" y2="480"/><line x1="0" y1="510" x2="600" y2="510"/>
    <line x1="0" y1="550" x2="600" y2="550"/>
    <line x1="300" y1="430" x2="300" y2="600"/>
    <line x1="270" y1="430" x2="180" y2="600"/><line x1="330" y1="430" x2="420" y2="600"/>
    <line x1="240" y1="430" x2="60" y2="600"/><line x1="360" y1="430" x2="540" y2="600"/>
    <line x1="210" y1="430" x2="-60" y2="600"/><line x1="390" y1="430" x2="660" y2="600"/>
  </g>
</svg>
