<!doctype html>
<!-- Moldura: fica em tela cheia e carrega o painel (app.html) por dentro.
     Assim o painel pode recarregar (modo dev) sem o navegador sair da tela cheia. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SpareScreen</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="app" allowfullscreen></iframe>
  <script>
    // Repassa os parâmetros (?tela=, ?tema=...) para o painel.
    document.getElementById("app").src = "app.html" + location.search;
  </script>
</body>
</html>
