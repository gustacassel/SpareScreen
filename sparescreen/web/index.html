<!doctype html>
<!-- Frame: stays fullscreen and loads the dashboard (app.html) inside it.
     This way the dashboard can reload (dev mode) without the browser leaving fullscreen. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SpareScreen</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="app" allowfullscreen></iframe>
  <script>
    // Pass the parameters (?screen=, ?theme=...) on to the dashboard.
    document.getElementById("app").src = "app.html" + location.search;
  </script>
</body>
</html>
